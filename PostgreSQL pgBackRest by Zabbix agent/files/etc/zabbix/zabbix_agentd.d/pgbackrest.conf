# pgBackRest monitoring - "PostgreSQL pgBackRest by Zabbix agent" template.
#
# Install as /etc/zabbix/zabbix_agentd.d/pgbackrest.conf
# (Zabbix agent 2: /etc/zabbix/zabbix_agent2.d/pgbackrest.conf),
# then restart the agent.
#
# Requires /usr/local/bin/zabbix-pgbackrest-info and
# /etc/sudoers.d/zabbix-pgbackrest.
#
#   -n  never prompt for a password (fail immediately on a sudoers problem
#       instead of hanging until the agent timeout)
#   -H  set HOME to postgres' home, so pgbackrest finds
#       ~postgres/.ssh/known_hosts for SFTP repositories
#       (unless repoN-sftp-known-host is configured)

UserParameter=pgbackrest.info[*],sudo -n -H -u postgres /usr/local/bin/zabbix-pgbackrest-info "$1"
