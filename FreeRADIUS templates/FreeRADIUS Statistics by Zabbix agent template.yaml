      expression: 'last(/FreeRADIUS Statistics by Zabbix agent/radiusstats.global.internal.threads_active)/last(/FreeRADIUS Statistics by Zabbix agent/radiusstats.global.internal.threads_max)*100>{$RADIUS.THREADS.NEARMAX.WARN}'
      name: 'FreeRADIUS worker threads near max on {HOST.NAME}'
      priority: WARNING
      description: 'Active worker threads exceed {$RADIUS.THREADS.NEARMAX.WARN}% of Threads-Max. The server is close to its configured thread pool limit; consider raising max_servers or investigating why requests are taking long to process.'
      tags:
        - tag: category
          value: internal
        - tag: component
          value: statistics
