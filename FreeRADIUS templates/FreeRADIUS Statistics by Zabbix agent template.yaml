          description: 'FreeRADIUS-Queue-Len-Auth threshold that triggers a backlog warning.'
        - macro: '{$RADIUS.REJECT.RATE.WARN}'
          value: '1'
          description: 'Global Access-Reject rate threshold (rejects/s, averaged over 5 minutes) that triggers a warning. Starting default - tune to your observed baseline.'
        - macro: '{$RADIUS.STATS.TYPE.CLIENT}'
