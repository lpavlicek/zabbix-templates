          description: 'Raw reply from the FreeRADIUS status server (radclient status query). Feeds all other radiusstats.global.* items as a dependent-item master; not meant to be read directly. History disabled (0) since only the parsed dependent items need to be kept. Liveness/failure detection is done via nodata() on the internal.threads_active dependent item instead of on this raw item, since history=0 items do not reliably support nodata(). Custom timeout (6s) accommodates radclient retries (-r 2 -t 2, worst case ~4s).'
          timeout: 6s
          tags:
            - tag: component
              value: statistics
            - tag: stage
              value: raw
      discovery_rules:
        - uuid: cf36dc2b385d4eb4b8e446af2f47895a
          name: 'FreeRADIUS clients discovery'
          key: 'radiusclient.discovery[{$RADIUS.CLIENTS}]'
          delay: 1h
          description: 'Discovers RADIUS NAS clients to monitor individually, from the manually maintained {$RADIUS.CLIENTS} macro (format: ip1:label1,ip2:label2).'
          item_prototypes:
            - uuid: 62bb4e760cee4c4db42f147d6c09b54d
              name: 'FreeRADIUS client Access-Accepts: {#CLIENTLABEL} ({#CLIENTIP}) rate'
              type: DEPENDENT
              key: 'radiusstats.client.access_accepts[{#CLIENTIP}]'
              value_type: FLOAT
              units: /s
              description: 'Rate of Access-Accepts per second for this RADIUS client ({#CLIENTIP}), computed by Zabbix "Change per second" preprocessing over the underlying FreeRADIUS cumulative counter (resets to 0 on FreeRADIUS restart, which may cause one transient negative-looking gap in the rate right after a restart - Zabbix discards that single invalid delta automatically).'
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'FreeRADIUS-Total-Access-Accepts = ([0-9]+)'
                    - \1
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'radiusstats.client[{$RADIUS.STATUS.HOST},{$RADIUS.STATUS.PORT},{$RADIUS.STATS.TYPE.CLIENT},{#CLIENTIP}]'
              tags:
                - tag: client
                  value: '{#CLIENTIP}'
