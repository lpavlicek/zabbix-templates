zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a1c09fe31fae4b56b41195ab9b4910ff
      name: 'lpavlicek templates'
  templates:
    - uuid: 8482babc5eb0498db1bec96bdff7db4a
      template: 'FreeRADIUS Statistics by Zabbix agent'
      name: 'FreeRADIUS Statistics by Zabbix agent'
      description: 'Monitors FreeRADIUS 3.2 server statistics via the built-in status server (radclient status queries), both globally and per RADIUS client (NAS). Requires freeradius_stats.sh installed on the host, registered as Zabbix agent UserParameters, and the status virtual server enabled in FreeRADIUS with a client allowing queries from the Zabbix agent host. Note: RadSec/TLS clients appear in "radmin show client list" but FreeRADIUS does not provide per-client statistics for them (status server replies with FreeRADIUS-Stats-Error = "No such client") - do not add RadSec clients to {$RADIUS.CLIENTS}.'
      vendor:
        name: lpavlicek
        version: 7.4-1
      groups:
        - name: 'lpavlicek templates'
      items:
        - uuid: 4dc5c21585304f32b1eb0789176a8070
          name: 'FreeRADIUS Acct-Dropped-Requests rate'
          type: DEPENDENT
          key: radiusstats.global.acct.dropped
          value_type: FLOAT
          units: /s
          description: 'Rate of Acct-Dropped-Requests per second, computed by Zabbix "Change per second" preprocessing over the underlying FreeRADIUS cumulative counter (resets to 0 on FreeRADIUS restart, which may cause one transient invalid delta right after a restart - Zabbix discards it automatically). Source: FreeRADIUS status server, category Accounting.'
          preprocessing:
            - type: REGEX
              parameters:
                - 'FreeRADIUS-Total-Acct-Dropped-Requests = ([0-9]+)'
                - \1
            - type: CHANGE_PER_SECOND
          master_item:
            key: 'radiusstats.global[{$RADIUS.STATUS.HOST},{$RADIUS.STATUS.PORT},{$RADIUS.STATS.TYPE.GLOBAL}]'
          tags:
            - tag: category
              value: accounting
            - tag: component
              value: statistics
          triggers:
            - uuid: 37503c49f0f44fe096cfa776eacfd808
              expression: 'avg(/FreeRADIUS Statistics by Zabbix agent/radiusstats.global.acct.dropped,10m)>{$RADIUS.ACCT.DROPPED.WARN}'
              name: 'FreeRADIUS high receiving dropped accounting requests rate on {HOST.NAME}'
              priority: WARNING
              description: 'Average receiving dropped accounting requests rate over the last 10 minutes exceeded {$RADIUS.ACCT.DROPPED.WARN} dropped/s. Accounting data is being lost - check server load and the SQL/logging backend used by the acct virtual server.'
              tags:
                - tag: category
                  value: accounting
                - tag: component
                  value: statistics
        - uuid: 3238da31a6f74da88133799405f2bb62
          name: 'FreeRADIUS Acct-Duplicate-Requests rate'
          type: DEPENDENT
          key: radiusstats.global.acct.duplicate
          value_type: FLOAT
          units: /s
          description: 'Rate of Acct-Duplicate-Requests per second, computed by Zabbix "Change per second" preprocessing over the underlying FreeRADIUS cumulative counter (resets to 0 on FreeRADIUS restart, which may cause one transient invalid delta right after a restart - Zabbix discards it automatically). Source: FreeRADIUS status server, category Accounting.'
          preprocessing:
            - type: REGEX
              parameters:
                - 'FreeRADIUS-Total-Acct-Duplicate-Requests = ([0-9]+)'
                - \1
            - type: CHANGE_PER_SECOND
          master_item:
            key: 'radiusstats.global[{$RADIUS.STATUS.HOST},{$RADIUS.STATUS.PORT},{$RADIUS.STATS.TYPE.GLOBAL}]'
          tags:
            - tag: category
              value: accounting
            - tag: component
              value: statistics
