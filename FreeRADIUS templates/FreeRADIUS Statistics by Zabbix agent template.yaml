                  expression: 'avg(/FreeRADIUS Statistics by Zabbix agent/radiusstats.client.access_rejects[{#CLIENTIP}],10m)>{$RADIUS.CLIENT.REJECT.WARN}'
                  name: 'High Access-Reject rate from client {#CLIENTLABEL} ({#CLIENTIP})'
                  priority: WARNING
