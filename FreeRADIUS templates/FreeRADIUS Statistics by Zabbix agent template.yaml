                  name: 'Unable to query FreeRADIUS client statistics for {#CLIENTLABEL} ({#CLIENTIP}) on {HOST.NAME}'
                  priority: AVERAGE
                  description: 'No data has been received for this client''s statistics for 10 minutes. Check that the IP in {$RADIUS.CLIENTS} matches a configured (non-RadSec) client in clients.conf. (Checked via this item specifically - no discard-unchanged-heartbeat here, so nodata() cannot give a false positive during quiet periods.)'
