          description: 'Comma-separated list of NAS clients to monitor individually. Format: ip1:label1,ip2:label2. Update with real NAS IPs. Do not include RadSec/TLS clients - FreeRADIUS does not provide per-client statistics for them, the item would stay permanently "not supported".'
