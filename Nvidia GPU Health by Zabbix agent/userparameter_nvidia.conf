# NVIDIA GPU monitoring - UserParameter definitions
# Copy to: /etc/zabbix/zabbix_agent2.d/nvidia.conf
# Then restart: systemctl restart zabbix-agent2

# Compute applications (processes) - master item for LLD
UserParameter=nvidia.apps.json,/etc/zabbix/scripts/nvidia/nvidia_apps_json.py

# GPU health: index, pstate (ERR! = driver lost contact), persistence_mode
UserParameter=nvidia.health.json,nvidia-smi --query-gpu=index,pstate,persistence_mode --format=csv,noheader 2>&1

# NVLink error counters (all GPUs, all links)
# On systems without NVLink this returns an error - set macro {$NVLINK_PRESENT}=0 in Zabbix
UserParameter=nvidia.nvlink.json,nvidia-smi nvlink --errorcounters 2>&1
