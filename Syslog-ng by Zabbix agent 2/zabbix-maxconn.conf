# Install to /etc/syslog-ng/conf.d/zabbix-maxconn.conf
#
# Copies syslog-ng internal messages about rejected connections (max-connections() reached)
# to a dedicated file readable by the zabbix group, so that the Zabbix agent does not need
# access to /var/log/messages. Requires that source "src" contains internal() (default on SLES).
# The messages are still delivered to /var/log/messages as before (no flags(final)).

filter f_zbx_maxconn {
    message("Number of allowed concurrent connections reached");
};

destination d_zbx_maxconn {
    file("/var/log/syslog-ng-maxconn.log"
        owner(root)
        group(zabbix)
        perm(0640)
        suppress(0)
    );
};

log {
    source(src);
    filter(f_zbx_maxconn);
    destination(d_zbx_maxconn);
};
