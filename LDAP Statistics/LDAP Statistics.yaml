              value: ldap
        - uuid: 22cd6a734d1d45a6996a33b0a986a3fb
          name: 'LDAP: Search operations, ops/sec'
          type: DEPENDENT
          key: ldap.stats.ops.search.rate
          value_type: FLOAT
          units: ops/s
          description: 'Rate of completed LDAP Search operations, derived from monitorOpCompleted under cn=Search,cn=Operations,cn=Monitor.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.operations.search
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: 'ldap_stats.sh[{HOST.DNS},{$LDAP.PORT},{$LDAP.BIND.DN},{$LDAP.BIND.PASSWORD},{$LDAP.BIND.TIMEOUT}]'
          tags:
            - tag: component
              value: ldap
        - uuid: 379916cf54bd4ce2bb6ac8f5a3615d7f
          name: 'LDAP: Unbind operations, ops/sec'
          type: DEPENDENT
          key: ldap.stats.ops.unbind.rate
          value_type: FLOAT
          units: ops/s
          description: 'Rate of completed LDAP Unbind operations, derived from monitorOpCompleted under cn=Unbind,cn=Operations,cn=Monitor.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.operations.unbind
              error_handler: DISCARD_VALUE
            - type: CHANGE_PER_SECOND
          master_item:
            key: 'ldap_stats.sh[{HOST.DNS},{$LDAP.PORT},{$LDAP.BIND.DN},{$LDAP.BIND.PASSWORD},{$LDAP.BIND.TIMEOUT}]'
          tags:
            - tag: component
              value: ldap
        - uuid: 21e4188774af410995e23218212a4ce3
          name: 'LDAP: slapd start time'
          type: DEPENDENT
          key: ldap.stats.start_time
          value_type: CHAR
          description: |
            Server start time (monitorTimestamp under cn=Start,cn=Time,
            cn=Monitor), reformatted from GeneralizedTime to
            "YYYY-MM-DD HH:MM:SS". Purely informational - a recent value
            is an indirect signal of a recent restart; there is no trigger
            on this item.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.start_time
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 2h
          master_item:
            key: 'ldap_stats.sh[{HOST.DNS},{$LDAP.PORT},{$LDAP.BIND.DN},{$LDAP.BIND.PASSWORD},{$LDAP.BIND.TIMEOUT}]'
          tags:
            - tag: component
              value: ldap
        - uuid: 1b6ce8ffc456424fb506e62b7b2d967a
          name: 'LDAP: cn=Monitor raw statistics'
          type: EXTERNAL
          key: 'ldap_stats.sh[{HOST.DNS},{$LDAP.PORT},{$LDAP.BIND.DN},{$LDAP.BIND.PASSWORD},{$LDAP.BIND.TIMEOUT}]'
          delay: 5m
          history: '0'
          value_type: TEXT
          description: |
            Raw JSON output of ldap_stats.sh, parsed by the dependent items
            below. Not meant to be read directly; history is disabled ('0')
            since this is only a transport item for the dependent items.
            
            Runs up to three separate ldapsearch queries against cn=Monitor
            internally (operations, current connections, start time); each
            section is included in the JSON only if its own query succeeded,
            so a single slow/failing query does not blank out the others.
            If everything fails (bad credentials, network error, or a
            deployment problem such as an unset {$LDAP.BIND.PASSWORD} on
            this host), the output is {"error": "<reason>"} instead and all
            dependent items below simply keep their last known value.
          timeout: 15s
          tags:
            - tag: component
              value: ldap
      tags:
        - tag: class
          value: application
        - tag: target
          value: ldap
      macros:
        - macro: '{$LDAP.BIND.DN}'
          value: 'uid=monitor,ou=admin,dc=vse,dc=cz'
          description: 'Bind DN used to read cn=Monitor (same account on every LDAP server; anonymous bind is disabled).'
        - macro: '{$LDAP.BIND.PASSWORD}'
          type: SECRET_TEXT
          description: 'Password for {$LDAP.BIND.DN}. Must be set per host - the demo LDAP server uses a different password than the others.'
        - macro: '{$LDAP.BIND.TIMEOUT}'
          value: '3'
          description: 'Network and search time limit (seconds) passed to ldapsearch for each of the up to three cn=Monitor queries (-o nettimeout, -l).'
        - macro: '{$LDAP.PORT}'
          value: '636'
          description: 'TCP port used for LDAPS.'
