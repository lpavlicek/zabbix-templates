              parameters:
                - $.activity_apps_activations.last_run_seconds_ago
          master_item:
            key: m365activity.data
          tags:
            - tag: source
              value: apps_activations
          triggers:
            - uuid: 4d45fb4510a8440caf8882da2f2e47cc
              expression: 'last(/M365 Activity Reports Pipeline/m365activity.apps_activations.last_run_seconds_ago)>{$M365ACTIVITY_STALE_HIGH}'
              name: 'M365 Activity M365 Apps Activations: data starší než {$M365ACTIVITY_STALE_HIGH}'
              opdata: '{ITEM.LASTVALUE}'
              priority: HIGH
              description: 'Poslední úspěšný běh loaderu pro M365 Apps Activations je starší než {$M365ACTIVITY_STALE_HIGH}. Zkontroluj cron (m365activity_fetch_load_reports.sh) a /opt/m365activity/logs/.'
