zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a1c09fe31fae4b56b41195ab9b4910ff
      name: 'lpavlicek templates'
  templates:
    - uuid: abbd7c85c58a4b3bbefc5a8d787d6c14
      template: 'M365 Activity Reports Pipeline'
      name: 'M365 Activity Reports Pipeline'
      description: |
        Monitoring pipeline pro stahování a nahrávání M365 usage/activity reportů a reportu o přiřazených licencích do PostgreSQL/TimescaleDB (schema activity, sdílená databáze s m365logs).
        
        Data jsou sbírána přes zabbix_sender (push model, TLS/PSK) z Ubuntu serveru kde běží pipeline. Skript m365activity_monitor.sh volá m365activity_zabbix_data.pl který čte z DB a posílá JSON jako hodnotu master trapper itemu m365activity.data.
        
        Na rozdíl od M365 Sign-in Logs Pipeline zde neexistuje checkpoint (etl.fetch_state se nepoužívá) - klíčová metrika je doba od posledního úspěšného běhu loaderu (last_run_seconds_ago), VŽDY VE VTEŘINÁCH, ne v minutách.
        
        Zdroje dat:
               etl.load_runs - status a statistiky běhů loaderu, source s prefixem activity_*
      vendor:
        name: lpavlicek
        version: 7.4-1
      groups:
        - name: 'lpavlicek templates'
      items:
        - uuid: 4d47c6877d984e8f8bde28035104035f
          name: 'M365 Apps Activations: status posledního nahrání'
          type: DEPENDENT
          key: m365activity.apps_activations.last_run_ok
          description: '1 = poslední nahrání úspěšné (success), 0 = selhalo nebo nikdy neběželo'
          valuemap:
            name: 'Nahrávání OK'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.activity_apps_activations.last_run_ok
          master_item:
            key: m365activity.data
          tags:
            - tag: source
              value: apps_activations
          triggers:
            - uuid: 4f046bf0f25546b094dd3139e29f1906
              expression: 'last(/M365 Activity Reports Pipeline/m365activity.apps_activations.last_run_ok)=0'
              name: 'M365 Activity M365 Apps Activations: poslední nahrání selhalo'
              priority: AVERAGE
              description: 'Poslední dokončený běh loaderu pro M365 Apps Activations skončil chybou nebo loader ještě nikdy neběžel. Zkontroluj /opt/m365activity/logs/cron_fetch_load_*.log, /opt/m365activity/logs/load_activity_reports.log a adresář /opt/m365activity/var/raw/error/.'
              tags:
                - tag: scope
                  value: availability
                - tag: source
                  value: apps_activations
        - uuid: 93434d5ce5164c27b787ae557500cabf
          name: 'M365 Apps Activations: doba od posledního nahrání'
          type: DEPENDENT
          key: m365activity.apps_activations.last_run_seconds_ago
          units: s
          preprocessing:
